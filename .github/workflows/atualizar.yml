name: Atualizar dados e publicar o site

on:
  schedule:
    # De hora em hora, no minuto 17. O horário do cron é sempre UTC (Brasília = UTC-3).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refazer_tudo:
        description: "Buscar todas as rodadas de novo (ignora o que já está salvo)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "atualizar.py"
      - "requirements.txt"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write   # para gravar o site/dados.json no repositório
  pages: write      # para publicar no GitHub Pages
  id-token: write   # exigido pelo deploy do Pages

# Uma execução por vez, para duas não tentarem gravar o dados.json ao mesmo tempo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar as pontuações no Cartola
        run: python atualizar.py ${{ inputs.refazer_tudo && '--refazer-tudo' || '' }}

      - name: Salvar o dados.json se ele mudou
        run: |
          if [ -n "$(git status --porcelain site/dados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/dados.json
            git commit -m "Atualiza dados do Cartola"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "dados.json sem mudanças."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
